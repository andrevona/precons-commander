<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precons Commander</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f5fd0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --mut:#6b6b66; --line:#d9d8d2; --acc:#2f5fd0; --accfg:#fff; --card:#fff; --ok:#1d7a3a; --warn:#b05a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --mut:#9c9b94; --line:#34332f; --acc:#7da2ff; --accfg:#10131c; --card:#1e1e1c; --ok:#6fcf8a; --warn:#f0a04b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--mut); margin: 0 0 16px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; }
  .tab:hover { border-color: var(--acc); }
  .tab.on { background:var(--acc); color:var(--accfg); border-color:var(--acc); }
  .tab.small { padding:4px 10px; font-size:14px; border-radius:8px; }
  .tab .n { opacity:.65; font-size:12px; margin-left:6px; white-space:nowrap; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .grow { flex:1; min-width:180px; }
  button.go { background:var(--acc); color:var(--accfg); border:0; padding:8px 16px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); padding:7px 12px; border-radius:8px; font:inherit; cursor:pointer; }
  .lista { position:relative; background:var(--bg); border-radius:8px; }
  textarea { display:block; position:relative; z-index:1; width:100%; min-height:420px; margin:0; background:transparent; -webkit-appearance:none; appearance:none; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font:13px/1.45 ui-monospace, Menlo, Consolas, monospace; resize:vertical; white-space:pre; overflow:auto; }
  .espelho { position:absolute; inset:0; overflow:hidden; border:1px solid transparent; border-radius:8px; padding:10px; font:13px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space:pre; color:transparent; pointer-events:none; }
  .espelho div { height:1.45em; }
  .espelho div.hl { background:#ffe58a; border-radius:3px; }
  @media (prefers-color-scheme: dark) { .espelho div.hl { background:#5c4a00; } }
  input.filtro { width:100%; margin:0 0 12px; padding:9px 12px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; font:inherit; }
  .status { color:var(--mut); margin-bottom:8px; }
  .status.ok { color:var(--ok); } .status.warn { color:var(--warn); }
  .sec { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); font-weight:600; margin:16px 0 8px; }
  hr.div { border:0; border-top:2px solid var(--line); margin:18px 0 0; }
  .tab:not(.small) { font-weight:600; padding:8px 16px; }
  .tab.small { border-radius:6px; background:transparent; }
  .tab.small.on { background:var(--card); color:var(--acc); border-color:var(--acc); box-shadow:inset 0 -3px 0 var(--acc); font-weight:600; }
  .tab img.ic { width:18px; height:18px; vertical-align:-4px; margin-right:8px; object-fit:contain; }
  .tab.on img.ic { filter:invert(1); }
  @media (prefers-color-scheme: dark) { .tab img.ic { filter:invert(.92); } .tab.on img.ic { filter:none; } }
  #grupos { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
  #grupos .tab { border-radius:8px; text-align:center; padding:10px 8px; display:flex; align-items:center; justify-content:center; }
  @media (min-width:640px) { #grupos { grid-template-columns:repeat(4,1fr); } }
  [hidden] { display:none !important; }
  #anos { position:relative; flex-wrap:nowrap; overflow-x:auto; gap:4px; margin:0 0 8px; padding-bottom:4px; scrollbar-width:thin; }
  #anos .tab { flex:none; padding:3px 10px; font-size:13px; font-weight:500; }
  footer { margin-top:28px; color:var(--mut); font-size:12.5px; text-align:center; }
  footer a { color:inherit; }
  #colecoes .tab { position:relative; z-index:1; }
  #colecoes .tab.on { z-index:3; }
  #colecoes .tab .mais { margin-left:8px; font-size:12px; opacity:.8; white-space:nowrap; }
  .busca { position:relative; margin:0 0 12px; }
  .busca input.filtro { margin:0; padding-right:44px; }
  .busca input.filtro::-webkit-search-cancel-button { -webkit-appearance:none; display:none; }
  .limpar { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; border-radius:999px; background:var(--line); color:var(--fg); font-size:20px; line-height:1; font-family:inherit; cursor:pointer; padding:0; }
  .limpar:hover { background:var(--acc); color:var(--accfg); }
</style>
</head>
<body>
<main>
  <h1>Precons Commander</h1>
  <p class="sub">Escolha a coleção e o deck. A lista está no formato <code>quantidade Nome (SET) número</code>, pronta para colar no endstep.cc.</p>

  <div class="tabs" id="grupos"></div>
  <div class="sec" id="secCol">Coleções</div>
  <div class="tabs" id="anos"></div>
  <div class="tabs" id="colecoes"></div>
  <hr class="div">
  <div class="sec">Decks</div>
  <div class="busca">
    <input class="filtro" id="filtro" type="search" placeholder="Carta, deck, comandante ou coleção…" autocomplete="off" spellcheck="false">
    <button type="button" class="limpar" id="limpar" aria-label="Apagar busca" title="Apagar busca" hidden>×</button>
  </div>
  <div class="status" id="contagem" style="margin:-6px 0 10px"></div>

  <div class="tabs" id="decks"></div>

  <div class="panel">
    <div class="row">
      <strong id="titulo" class="grow"></strong>
      <button class="ghost" id="btnBaixar">Baixar .txt</button>
      <button class="go" id="btnCopiar">Copiar lista</button>
    </div>
    <div class="status" id="status"></div>
    <div class="lista"><div class="espelho" id="espelho" aria-hidden="true"></div><textarea id="saida" readonly spellcheck="false" wrap="off"></textarea></div>
  </div>
  <footer>__RODAPE__</footer>
</main>

<script>
// Dados embutidos: cada deck ja vem pronto (comandante, linha em branco, resto em ordem alfabetica).
var COLECOES = __DATA__;
var GRUPOS = __GRUPOS__;
var grpAtual = GRUPOS[0];
var GRP_ICONE = { "Secret Lair": "star" };
var RECOLHEM = ["Universes Within"]; // só este grupo tem tantas coleções a ponto de recolher
var SEM_COLECAO = ["Secret Lair"]; // grupos com uma unica colecao: lista os decks direto

var colAtual = 0, deckAtual = 0;
var anoFiltro = "";
var recolhido = false, animando = false; // coleções recolhidas sob o botão escolhido
function $(id) { return document.getElementById(id); }

function contar(texto) {
  var total = 0;
  texto.split("\n").forEach(function (l) { var m = /^(\d+)\s/.exec(l); if (m) total += parseInt(m[1], 10); });
  return total;
}

COLECOES.forEach(function (col) { col.decks.forEach(function (d) { d._col = col; }); });

var q = "";
function nomesDe(deck) {
  if (!deck._n) {
    deck._n = [];
    deck.lista.split("\n").forEach(function (l) { var m = /^\d+\s+(.+?)\s+\(\w+\)\s+\S+$/.exec(l); if (m) deck._n.push(m[1]); });
  }
  return deck._n;
}
function acertos(deck) {
  if (!q) return [];
  return nomesDe(deck).filter(function (n) { return n.toLowerCase().indexOf(q) >= 0; });
}
function casa(deck) {
  if (!q) return true;
  var col = deck._col;
  return deck.nome.toLowerCase().indexOf(q) >= 0 || deck.comandante.toLowerCase().indexOf(q) >= 0 || col.nome.toLowerCase().indexOf(q) >= 0 || (col.ano && col.ano.indexOf(q) >= 0) || acertos(deck).length > 0;
}

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
// Destaca as linhas cujo nome de carta contem a busca e rola a lista ate a primeira.
function destacar(deck) {
  var ta = $("saida"), esp = $("espelho");
  var linhas = deck.lista.split("\n"), primeira = -1;
  esp.innerHTML = linhas.map(function (l, i) {
    var m = /^\d+\s+(.+?)\s+\(\w+\)\s+\S+$/.exec(l);
    var hit = q && m && m[1].toLowerCase().indexOf(q) >= 0;
    if (hit && primeira < 0) primeira = i;
    return '<div' + (hit ? ' class="hl"' : '') + '>' + (l ? esc(l) : "&nbsp;") + '</div>';
  }).join("");
  var lh = parseFloat(getComputedStyle(ta).lineHeight) || 18.85;
  ta.scrollTop = primeira < 0 ? 0 : Math.max(0, primeira * lh - (ta.clientHeight - lh) / 2);
  ta.scrollLeft = 0;
  esp.scrollTop = ta.scrollTop; esp.scrollLeft = 0;
}

// Link direto (#pasta/deck) e memória da última seleção (localStorage, só neste aparelho).
function idDe(deck) { return deck._col.id + "/" + deck.arquivo.replace(/\.txt$/, ""); }
function guardarSelecao(deck) {
  var id = idDe(deck);
  try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (e) {}
  if (!q) { try { localStorage.setItem("precons-sel", id); } catch (e) {} }
}
function aplicarId(id) {
  var ok = false;
  COLECOES.forEach(function (col, ci) {
    col.decks.forEach(function (dk, di) {
      if (ok || idDe(dk) !== id) return;
      ok = true; grpAtual = col.grupo; colAtual = ci; deckAtual = di; anoFiltro = "";
      recolhido = RECOLHEM.indexOf(col.grupo) >= 0;
    });
  });
  return ok;
}
function idDoEndereco() { try { return decodeURIComponent(location.hash.replace(/^#/, "")); } catch (e) { return ""; } }

function desenhar() {
  var vis = [];
  var nd = 0;
  COLECOES.forEach(function (col) { col.decks.forEach(function (dk) { if (casa(dk)) nd++; }); });
  $("contagem").textContent = q ? (nd === 1 ? "1 deck encontrado" : nd + " decks encontrados") : "";
  var cont = {};
  COLECOES.forEach(function (col) { var k = col.decks.filter(casa).length; if (k) cont[col.grupo] = (cont[col.grupo] || 0) + k; });
  var gvis = GRUPOS.filter(function (g) { return cont[g]; });
  var gEl = $("grupos"); gEl.innerHTML = "";
  if (gvis.length && gvis.indexOf(grpAtual) < 0) { grpAtual = gvis[0]; colAtual = -1; }
  gvis.forEach(function (g) {
    var b = document.createElement("button");
    b.className = "tab" + (g === grpAtual ? " on" : "");
    if (GRP_ICONE[g]) { var gi = document.createElement("img"); gi.className = "ic"; gi.alt = ""; gi.src = "icons/" + GRP_ICONE[g] + ".svg"; gi.onerror = function () { this.style.display = "none"; }; b.appendChild(gi); }
    b.appendChild(document.createTextNode(g));
    var gn = document.createElement("span"); gn.className = "n"; gn.textContent = cont[g]; b.appendChild(gn);
    b.onclick = function () { if (grpAtual !== g) { grpAtual = g; colAtual = -1; deckAtual = 0; recolhido = false; desenhar(); } };
    gEl.appendChild(b);
  });
  var comAno = RECOLHEM.indexOf(grpAtual) >= 0, base = [], anos = [];
  COLECOES.forEach(function (col, i) {
    if (col.grupo !== grpAtual || !col.decks.some(casa)) return;
    base.push(i);
    if (col.ano && anos.indexOf(col.ano) < 0) anos.push(col.ano);
  });
  if (!comAno || anos.indexOf(anoFiltro) < 0) anoFiltro = "";
  base.forEach(function (i) { if (!anoFiltro || COLECOES[i].ano === anoFiltro) vis.push(i); });
  var semCol = SEM_COLECAO.indexOf(grpAtual) >= 0;
  $("secCol").hidden = semCol; $("colecoes").hidden = semCol;
  var aEl = $("anos"), sl = aEl.scrollLeft; aEl.innerHTML = "";
  aEl.hidden = semCol || !comAno || anos.length < 2;
  if (!aEl.hidden) {
    var ativo = null;
    [""].concat(anos).forEach(function (a) {
      var ab = document.createElement("button");
      ab.className = "tab" + (a === anoFiltro ? " on" : "");
      ab.textContent = a || "Todos";
      ab.onclick = function () { if (animando) return; anoFiltro = (a && a === anoFiltro) ? "" : a; recolhido = false; desenhar(); };
      if (a === anoFiltro) ativo = ab;
      aEl.appendChild(ab);
    });
    aEl.scrollLeft = sl;
    if (ativo) {
      if (ativo.offsetLeft < aEl.scrollLeft) aEl.scrollLeft = ativo.offsetLeft - 8;
      else if (ativo.offsetLeft + ativo.offsetWidth > aEl.scrollLeft + aEl.clientWidth) aEl.scrollLeft = ativo.offsetLeft + ativo.offsetWidth - aEl.clientWidth + 8;
    }
  }
  var c = $("colecoes"); c.innerHTML = "";
  var d = $("decks"); d.innerHTML = "";
  var s = $("status");
  if (!vis.length) {
    $("titulo").textContent = "Nenhum deck encontrado";
    $("saida").value = "";
    s.textContent = "Nenhum deck, comandante ou carta com esse nome."; s.className = "status warn"; $("espelho").innerHTML = "";
    return;
  }
  if (vis.indexOf(colAtual) < 0) { colAtual = vis[0]; deckAtual = 0; recolhido = false; }
  var decks = COLECOES[colAtual].decks;
  if (!decks[deckAtual] || !casa(decks[deckAtual])) {
    for (var k = 0; k < decks.length; k++) { if (casa(decks[k])) { deckAtual = k; break; } }
  }
  vis.forEach(function (i) {
    if (recolhido && i !== colAtual) return;
    var col = COLECOES[i];
    var b = document.createElement("button");
    b.className = "tab" + (i === colAtual ? " on" : "");
    if (col.icone) { var im = document.createElement("img"); im.className = "ic"; im.alt = ""; im.src = "icons/" + col.icone + ".svg"; im.onerror = function () { this.style.display = "none"; }; b.appendChild(im); }
    b.appendChild(document.createTextNode(col.nome));
    var partes = [], nk = col.decks.filter(casa).length;
    if (col.ano && col.nome.indexOf(col.ano) < 0) partes.push(col.ano);
    partes.push(nk + (nk === 1 ? " deck" : " decks"));
    var y = document.createElement("span"); y.className = "n"; y.textContent = partes.join(" · "); b.appendChild(y);
    if (recolhido && vis.length > 1) {
      var m = document.createElement("span"); m.className = "mais"; m.textContent = "▾ +" + (vis.length - 1); b.appendChild(m);
      b.title = "Mostrar as outras coleções";
    }
    b.setAttribute("aria-expanded", recolhido ? "false" : "true");
    b.onclick = function () {
      if (animando) return;
      if (RECOLHEM.indexOf(grpAtual) < 0) { colAtual = i; deckAtual = 0; desenhar(); return; }
      if (recolhido) expandir(); else recolher(i, b);
    };
    c.appendChild(b);
  });
  decks.forEach(function (deck, i) {
    if (!casa(deck)) return;
    var b = document.createElement("button");
    b.className = "tab small" + (i === deckAtual ? " on" : "");
    b.textContent = deck.nome;
    b.onclick = function () { deckAtual = i; desenhar(); };
    d.appendChild(b);
  });
  var deck = decks[deckAtual];
  guardarSelecao(deck);
  var total = contar(deck.lista);
  $("titulo").textContent = deck.nome + " · " + deck.comandante;
  $("saida").value = deck.lista;
  destacar(deck);
  s.textContent = total + " cartas" + (total === 100 ? " ✓" : " (atenção: o esperado era 100)");
  var ac = acertos(deck);
  if (ac.length) s.textContent += " · encontrado: " + ac.join(", ");
  s.className = "status " + (total === 100 ? "ok" : "warn");
}

// Animação das coleções: as outras entram por baixo do botão clicado (recolher) e saem de baixo dele (expandir).
var DUR = 340, CURVA = "cubic-bezier(.4,0,.2,1)";
function semAnim() { return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches; }
function centro(r) { return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function limpar(els) { els.forEach(function (x) { x.style.transition = x.style.transform = x.style.opacity = x.style.height = x.style.overflow = ""; }); animando = false; }

// Rola a página para o botão escolhido ficar onde estava na tela; devolve quanto rolou de fato.
function manter(el, rAnt) {
  var y0 = window.scrollY;
  window.scrollBy(0, el.getBoundingClientRect().top - rAnt.top);
  return window.scrollY - y0;
}

// Encolher: numa só etapa curta, o botão escolhido sobe ao topo da área e os outros convergem sobre ele
// (o inverso de expandir) enquanto a área diminui; no fim a lista é redesenhada já recolhida.
var DUR_REC = 260;
function recolher(i, alvo) {
  var c = $("colecoes"), btns = [].slice.call(c.children);
  if (semAnim() || btns.length < 2) { colAtual = i; deckAtual = 0; recolhido = true; desenhar(); return; }
  animando = true;
  btns.forEach(function (x) { x.classList.toggle("on", x === alvo); });
  var cr = c.getBoundingClientRect(), ar = alvo.getBoundingClientRect();
  var dx = cr.left - ar.left, dy = cr.top - ar.top;
  var dest = { x: ar.left + ar.width / 2 + dx, y: ar.top + ar.height / 2 + dy };
  var pos = btns.map(function (x) { return centro(x.getBoundingClientRect()); });
  c.style.height = c.offsetHeight + "px";
  c.offsetHeight;
  var t = "transform " + DUR_REC + "ms " + CURVA + ", opacity " + DUR_REC + "ms " + CURVA;
  btns.forEach(function (x, k) {
    x.style.transition = t;
    if (x === alvo) { x.style.transform = "translate(" + dx + "px," + dy + "px)"; }
    else { x.style.transform = "translate(" + (dest.x - pos[k].x) + "px," + (dest.y - pos[k].y) + "px) scale(.5)"; x.style.opacity = "0"; }
  });
  c.style.transition = "height " + DUR_REC + "ms " + CURVA; c.style.height = alvo.offsetHeight + "px";
  // mantém o botão escolhido parado na tela enquanto a área encolhe (a página rola junto)
  var html = document.documentElement, t0 = performance.now();
  html.style.overflowAnchor = "none";
  (function passo() {
    var d = alvo.getBoundingClientRect().top - ar.top;
    if (d) window.scrollBy(0, d);
    if (performance.now() - t0 < DUR_REC + 20) requestAnimationFrame(passo);
  })();
  setTimeout(function () {
    colAtual = i; deckAtual = 0; recolhido = true; desenhar();
    manter(c.querySelector(".on"), ar);
    html.style.overflowAnchor = "";
    limpar([c]);
  }, DUR_REC + 20);
}

function expandir() {
  var c = $("colecoes"), sel = c.querySelector(".on");
  var rAnt = sel.getBoundingClientRect(), hAnt = c.offsetHeight;
  recolhido = false; desenhar();
  var novo = c.querySelector(".on"), rolou = manter(novo, rAnt);
  if (semAnim()) return;
  animando = true;
  var btns = [].slice.call(c.children), a = centro(rAnt), hNov = c.offsetHeight;
  btns.forEach(function (x) {
    var r = x.getBoundingClientRect();
    if (x === novo) { x.style.transform = "translate(" + (rAnt.left - r.left) + "px," + (rAnt.top - r.top) + "px)"; }
    else { var b = centro(r); x.style.transform = "translate(" + (a.x - b.x) + "px," + (a.y - b.y) + "px) scale(.5)"; x.style.opacity = "0"; }
  });
  c.style.height = Math.min(hNov, hAnt + rolou) + "px"; c.style.overflow = "hidden";
  c.offsetHeight;
  btns.forEach(function (x) {
    x.style.transition = "transform " + DUR + "ms " + CURVA + ", opacity " + DUR + "ms " + CURVA;
    x.style.transform = ""; x.style.opacity = "";
  });
  c.style.transition = "height " + DUR + "ms " + CURVA; c.style.height = hNov + "px";
  setTimeout(function () { limpar(btns.concat([c])); }, DUR + 20);
}

$("saida").addEventListener("scroll", function () { $("espelho").scrollTop = this.scrollTop; $("espelho").scrollLeft = this.scrollLeft; });
$("filtro").oninput = function () { q = this.value.trim().toLowerCase(); recolhido = false; $("limpar").hidden = !this.value; desenhar(); };
$("limpar").onclick = function () { var f = $("filtro"); f.value = ""; q = ""; this.hidden = true; desenhar(); f.focus(); };

$("btnCopiar").onclick = function () {
  var ta = $("saida");
  function feito() { var b = $("btnCopiar"); b.textContent = "Copiado ✓"; setTimeout(function () { b.textContent = "Copiar lista"; }, 1500); }
  function alt() { ta.focus(); ta.select(); try { document.execCommand("copy"); feito(); } catch (e) { alert("Selecione o texto e use Cmd+C."); } }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(feito, alt); else alt();
};

$("btnBaixar").onclick = function () {
  var deck = COLECOES[colAtual].decks[deckAtual];
  var blob = new Blob([deck.lista], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = deck.arquivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
};

var salvo = "";
try { salvo = localStorage.getItem("precons-sel") || ""; } catch (e) {}
if (!aplicarId(idDoEndereco())) aplicarId(salvo);
desenhar();
window.addEventListener("hashchange", function () {
  var id = idDoEndereco(), d = COLECOES[colAtual] && COLECOES[colAtual].decks[deckAtual];
