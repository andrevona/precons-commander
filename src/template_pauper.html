<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauper · Precons Commander</title>
<link rel="manifest" href="../manifest.json">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
  html { color-scheme:light dark; scrollbar-color:var(--line) var(--bg); }
  :root { --bg:#fafaf8; --fg:#1d1d1b; --mut:#6b6b66; --line:#d9d8d2; --acc:#2f5fd0; --accfg:#fff; --card:#fff; --levePct:9%; --ok:#1d7a3a; --warn:#b05a00;
    --g-acc:#1c3378; --g-accfg:#fff; --f-acc:#0b78b8; --f-accfg:#fff; /* tons de azul: grupos (escuro), coleções (--acc), filtros (claro) */
    --mW:#e4e0d2; --mU:#2b83d0; --mB:#6c588c; --mR:#d24d36; --mG:#2c8a48; --mC:#9b9a94; --deckBorda:#5f5e59;
    --inBg:#fff; --inBorda:#9a998f; --inSombra:0 1px 3px rgba(0,0,0,.10); --inAnel:rgba(11,120,184,.25); } /* campo de busca em destaque */ /* cores dos decks; borda neutra (escura no claro) */
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --mut:#9c9b94; --line:#34332f; --acc:#7da2ff; --accfg:#10131c; --card:#1e1e1c; --levePct:9%; --ok:#6fcf8a; --warn:#f0a04b;
      --g-acc:#3c5cc4; --g-accfg:#fff; --f-acc:#5ec4ef; --f-accfg:#0b1a22;
      --mW:#f6f4ee; --mU:#5aa8ee; --mB:#a991cc; --mR:#f07a62; --mG:#5cbf7c; --mC:#7f7e78; --deckBorda:#b4b3ac;
      --inBg:#2a2a27; --inBorda:#85847c; --inSombra:0 2px 8px rgba(0,0,0,.55); --inAnel:rgba(94,196,239,.32); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .formato { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:0 0 10px; font-size:13px; background:var(--card); }
  .formato a { padding:3px 12px; color:var(--mut); text-decoration:none; font-weight:600; }
  .formato a[aria-current] { background:var(--g-acc); color:var(--g-accfg); }
  .formato a:not([aria-current]):hover { color:var(--fg); }
  .sub { color: var(--mut); margin: 0 0 16px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; }
  .tab:hover { border-color: var(--acc); }
  .tab.on { background:var(--acc); color:var(--accfg); border-color:var(--acc); }
  .tab.small { padding:4px 10px; font-size:14px; border-radius:8px; }
  .tab .n { opacity:.65; font-size:12px; margin-left:6px; white-space:nowrap; }
  .arq-linha { display:flex; flex-wrap:wrap; gap:4px 6px; }
  .arq-linha .arq-tag { margin-left:0; }
  #titulo .arq-tag { vertical-align:2px; }
  #titulo .tit-cmd { display:block; font-size:13px; font-weight:400; color:var(--mut); margin-top:2px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .grow { flex:1; min-width:180px; }
  button.go { background:var(--acc); color:var(--accfg); border:0; padding:8px 16px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); padding:7px 12px; border-radius:8px; font:inherit; cursor:pointer; }
  .lista { position:relative; background:var(--bg); border-radius:8px; }
  textarea { display:block; position:relative; z-index:1; width:100%; min-height:420px; margin:0; background:transparent; -webkit-appearance:none; appearance:none; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font:13px/19px ui-monospace, Menlo, Consolas, monospace; resize:vertical; white-space:pre; overflow:auto; }
  .espelho { position:absolute; inset:0; overflow:hidden; border:1px solid transparent; border-radius:8px; padding:10px; font:13px/19px ui-monospace, Menlo, Consolas, monospace; white-space:pre; color:transparent; pointer-events:none; }
  .espelho div { height:19px; }
  .espelho div.hl { background:#ffe58a; border-radius:3px; }
  @media (prefers-color-scheme: dark) { .espelho div.hl { background:#5c4a00; } }
  input.filtro { width:100%; margin:0 0 12px; padding:10px 12px; background:var(--inBg); color:var(--fg); border:1.5px solid var(--inBorda); border-radius:10px; box-shadow:var(--inSombra); font:inherit; }
  input.filtro::placeholder { color:var(--mut); opacity:1; }
  input.filtro:focus { outline:none; border-color:var(--f-acc); box-shadow:0 0 0 3px var(--inAnel); }
  .status { color:var(--mut); margin-bottom:8px; }
  .status.ok { color:var(--ok); } .status.warn { color:var(--warn); }
  .sec { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); font-weight:600; margin:16px 0 8px; }
  hr.div { border:0; border-top:2px solid var(--line); margin:18px 0 0; }
  .tab:not(.small) { font-weight:600; padding:8px 16px; }
  .tab.small { border-radius:6px; background:transparent; }
  /* Decks: borda neutra igual para todos (contrasta com o fundo); só o deck escolhido ganha as cores (borda, fundo e brilho). */
  .tab.small { --fd:var(--bg); border:1.5px solid var(--deckBorda); background:var(--fd); position:relative; transition:transform .15s; }
  .tab.small:hover { border-color:var(--fg); }
  .tab.small.on { --fd:var(--card); color:var(--fg); font-weight:600; border:2.5px solid transparent; background:linear-gradient(var(--card), var(--card)) padding-box, var(--brilho, linear-gradient(var(--deckBorda), var(--deckBorda))) border-box; transform:translateY(-2px); }
  @supports (background: color-mix(in srgb, red 10%, blue)) {
    .tab.small.on { background:var(--tinta, linear-gradient(var(--card), var(--card))) padding-box, var(--brilho, linear-gradient(var(--deckBorda), var(--deckBorda))) border-box; }
  }
  .tab.small.on::after { content:""; position:absolute; left:8%; right:8%; top:100%; height:9px; margin-top:1px; border-radius:50%; background:var(--brilho, var(--deckBorda)); filter:blur(5px); opacity:.9; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .tab.small { transition:none; } }
  .tab img.ic { width:18px; height:18px; vertical-align:-4px; margin-right:8px; object-fit:contain; }
  .tab.on img.ic { filter:invert(1); }
  @media (prefers-color-scheme: dark) { .tab img.ic { filter:invert(.92); } .tab.on img.ic { filter:none; } }
  #grupos { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
  #grupos .tab.on { background:var(--g-acc); color:var(--g-accfg); border-color:var(--g-acc); }
  #grupos .tab:hover { border-color:var(--g-acc); }
  #grupos .tab { border-radius:8px; text-align:center; padding:10px 8px; display:flex; align-items:center; justify-content:center; }
  @media (min-width:640px) { #grupos { grid-template-columns:repeat(4,1fr); } }
  @media (max-width:439px) { #grupos .tab { padding:10px 4px; font-size:14px; } #grupos .tab .n, #grupos .tab .mais { margin-left:4px; } }
  [hidden] { display:none !important; }
  .sec-col { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px; }
  .filtros { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 12px; }
  .cor-caixa { position:relative; display:inline-flex; }
  .cor-btn { position:relative; display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:13px; font-weight:500; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 28px 4px 12px; min-height:29px; cursor:pointer; }
  .cor-btn:hover { border-color:var(--f-acc); }
  .cor-btn::after { content:"▾"; position:absolute; right:11px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:12px; color:var(--mut); }
  .cor-caixa.on .cor-btn { background:var(--f-acc); color:var(--f-accfg); border-color:var(--f-acc); }
  .cor-caixa.on .cor-btn::after { color:var(--f-accfg); }
  /* Celular: grade fixa de 2 colunas, para as pílulas não mudarem de lugar quando o texto muda (símbolos, nome do arquétipo,
     × de tirar o filtro, "Limpar tudo" que aparece e some). O × fica por cima da seta, sem aumentar a pílula. */
  @media (max-width:520px) {
    .filtros { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 6px; }
    .filtros .cor-caixa { min-width:0; }
    .filtros .cor-caixa .cor-btn { flex:1; min-width:0; overflow:hidden; white-space:nowrap; padding-left:10px; padding-right:26px; }
    .filtros .limpar-cor { position:absolute; right:3px; top:50%; transform:translateY(-50%); margin:0; width:20px; height:20px; font-size:14px; z-index:1; }
    .filtros .cor-caixa.on .cor-btn::after { visibility:hidden; }
    .filtros .limpar-tudo { justify-self:center; grid-column:1 / -1; }
    .filtros .sorte-grupo { justify-self:start; }
    .filtros .sorte-grupo #btnSorte { white-space:nowrap; gap:4px; padding:4px 12px 4px 9px; }
    .filtros .sorte-grupo .mesa-btn { padding:4px 8px 4px 7px; }
    .filtros .cor-btn { gap:4px; }
    .filtros .cor-btn .simbolos { gap:2px; }
    .filtros .cor-btn .simbolos img { width:13px; height:13px; }
    .filtros .cor-caixa:nth-child(even) .cor-menu { left:auto; right:0; }
  }
  .limpar-cor { width:26px; height:26px; margin-left:4px; align-self:center; border:0; border-radius:999px; background:var(--line); color:var(--fg); font:inherit; font-size:17px; line-height:1; padding:0; cursor:pointer; }
  .limpar-cor:hover { background:var(--f-acc); color:var(--f-accfg); }
  .simbolos { display:inline-flex; gap:2px; flex:none; }
  .simbolos img { width:17px; height:17px; display:block; }
  .cor-btn .simbolos img { width:16px; height:16px; }
  .cor-menu { position:absolute; left:0; top:calc(100% + 4px); z-index:20; margin:0; padding:4px; list-style:none; min-width:220px; max-width:calc(100vw - 32px); background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-height:min(380px, 60vh); overflow:auto; overscroll-behavior:contain; outline:none; }
  .cor-menu li { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:7px 10px; border-radius:7px; cursor:pointer; font-size:14px; white-space:nowrap; }
  .cor-menu .num { color:var(--mut); font-size:12px; margin-left:7px; }
  .sorte { padding-right:12px; font-weight:600; color:#1d1d1b; border:0; background:linear-gradient(100deg, #f3e6a6, #a9d3f5 28%, #cdbde6 50%, #f6ae9c 72%, #a8dcb2); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .sorte:hover { filter:brightness(1.05) saturate(1.15); }
  .sorte:active { transform:scale(.97); }
  .limpar-tudo { font:inherit; font-size:13px; color:var(--mut); background:transparent; border:1px dashed var(--line); border-radius:999px; padding:4px 12px; min-height:29px; cursor:pointer; }
  .limpar-tudo:hover { color:var(--fg); border-color:var(--fg); }
  .sorte::after { content:none; }
  .sorte svg { width:16px; height:16px; flex:none; }
  .sorte.gira svg { animation:gira .6s cubic-bezier(.4,0,.2,1); }
  @keyframes gira { to { transform:rotate(540deg) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .sorte.gira svg { animation:none; } }
  #decks { row-gap:10px; padding-bottom:4px; }
  .tab.small .simbolos { margin-left:8px; vertical-align:-3px; }
  .tab.small .simbolos img { width:14px; height:14px; }
  .cor-menu li.ativo { background:var(--line); }
  .cor-menu li[aria-selected="true"] { font-weight:600; color:var(--acc); }
  button.icone { padding:7px 10px; display:inline-flex; align-items:center; }
  button.icone svg { width:18px; height:18px; display:block; }
  .acoes { margin-bottom:8px; }
  .modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-caixa { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:430px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .modal-caixa h2 { font-size:18px; margin:0 0 6px; }
  .modal-caixa h2.ok { color:var(--ok); } .modal-caixa h2.erro { color:var(--warn); }
  .guia-sub { color:var(--mut); margin:0 0 10px; }
  .passos { margin:0 0 14px; padding-left:22px; } .passos li { margin:7px 0; }
  .guia-check { display:flex; gap:8px; align-items:center; color:var(--mut); font-size:14px; margin-bottom:16px; cursor:pointer; }
  .guia-botoes { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .aviso { position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60; width:max-content; max-width:calc(100% - 32px); background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:18px; font-size:13px; box-shadow:0 6px 22px rgba(0,0,0,.25); text-align:center; }
  footer { margin-top:28px; color:var(--mut); font-size:12.5px; text-align:center; }
  footer a { color:inherit; }
  footer .como { max-width:540px; margin:16px auto 0; text-align:left; }
  footer .como p { margin:0 0 6px; text-align:center; }
  footer details { margin-top:4px; }
  footer summary { display:flex; width:max-content; margin:0 auto; align-items:center; gap:6px; list-style:none; cursor:pointer; color:var(--acc); font-weight:600; padding:4px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); }
  footer summary::-webkit-details-marker { display:none; }
  footer summary::after { content:"▾"; font-size:11px; transition:transform .2s; }
  footer details[open] summary::after { transform:rotate(180deg); }
  footer details[open] summary { margin-bottom:10px; }
  footer .como ol { margin:0; padding-left:22px; }
  footer .como li { margin:4px 0; }
  footer .como p.intro { margin:10px 0 6px; text-align:left; }
  footer .como p.nota { margin:8px 0 0; text-align:left; }
  footer .como b { color:var(--fg); }
  footer .ban ul { columns:2 200px; column-gap:20px; margin:0; padding:0; list-style:none; }
  footer .ban li { margin:0 0 4px; break-inside:avoid; }
  footer .ban li span { color:var(--mut); }
  footer .ban li.grupo-ban { column-span:all; break-inside:auto; margin-top:10px; }
  #decks .tab .n { margin-left:6px; }
  /* Duelo */
  .duelo-vs { text-align:center; font-weight:800; letter-spacing:.08em; color:var(--mut); margin:2px 0; font-size:13px; }
  .duelo-info { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .duelo-info h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin:0 0 8px; }
  .duelo-info h3 + * { margin-top:0; }
  .duelo-info section + section { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .duelo-info p { margin:4px 0; font-size:14px; }
  .duelo-info .mut { color:var(--mut); font-size:12.5px; }
  .barra { display:flex; height:26px; border-radius:8px; overflow:hidden; font-size:12.5px; font-weight:700; margin:6px 0; }
  .barra span { display:flex; align-items:center; padding:0 8px; white-space:nowrap; min-width:0; color:var(--fg); }
  .barra span + span { justify-content:flex-end; }
  .barra-leg { display:flex; justify-content:space-between; gap:12px; font-size:12.5px; color:var(--mut); margin-top:2px; }
  .barra-leg span + span { text-align:right; }
  .comp { width:100%; border-collapse:collapse; font-size:14px; }
  .comp th, .comp td { padding:5px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  .comp tr:last-child th, .comp tr:last-child td { border-bottom:0; }
  .comp th { text-align:center; font-weight:400; color:var(--mut); font-size:12.5px; }
  .comp td { width:38%; text-align:center; }
  .comp td.melhor { font-weight:700; }
  .comp thead td { font-weight:700; }
  .curva { display:inline-flex; align-items:flex-end; gap:2px; height:34px; }
  .curva i { display:block; width:9px; background:var(--acc); border-radius:2px 2px 0 0; opacity:.75; }
  .curva-rot { display:flex; gap:2px; justify-content:center; font-size:9.5px; color:var(--mut); }
  .curva-rot b { width:9px; font-weight:400; text-align:center; }
  #colecoes .tab, #grupos .tab { position:relative; z-index:1; }
  #colecoes .tab.on, #grupos .tab.on { z-index:3; }
  .tab .mais { margin-left:8px; font-size:12px; opacity:.8; white-space:nowrap; }
  .busca { position:relative; margin:0 0 12px; }
  #caixaBusca { margin-top:12px; }
  .busca input.filtro { margin:0; padding-right:44px; }
  .busca input.filtro::-webkit-search-cancel-button { -webkit-appearance:none; display:none; }
  .limpar { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; border-radius:999px; background:var(--line); color:var(--fg); font-size:20px; line-height:1; font-family:inherit; cursor:pointer; padding:0; }
  .limpar:hover { background:var(--acc); color:var(--accfg); }
  .sugestoes { position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:20; margin:0; padding:4px; list-style:none; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-height:min(360px, 50vh); overflow:auto; overscroll-behavior:contain; }
  .sugestoes li { display:flex; justify-content:space-between; align-items:baseline; gap:2px 12px; padding:9px 10px; border-radius:7px; cursor:pointer; }
  .sugestoes li.pt { flex-wrap:wrap; }
  /* Par inglês/português da mesma carta: barra de destaque à esquerda e fundo levemente tingido, os dois colados */
  .sugestoes li.par { box-shadow:inset 3px 0 0 var(--acc); background:color-mix(in srgb, var(--acc) 7%, transparent); }
  .sugestoes li.par-a { border-bottom-left-radius:0; border-bottom-right-radius:0; padding-bottom:5px; }
  .sugestoes li.par-b { border-top-left-radius:0; border-top-right-radius:0; padding-top:5px; margin-bottom:4px; }
  .sugestoes li[aria-selected="true"] { background:var(--line); }
  .sugestoes .txt { flex:1 1 0; min-width:0; overflow-wrap:anywhere; } /* nomes longos quebram em mais linhas, sem cortar */
  .sugestoes .txt b { font-weight:700; color:var(--acc); }
  .sugestoes .tipo { flex:none; color:var(--mut); font-size:12px; }
  .sugestoes .tipo img.ic { width:14px; height:14px; vertical-align:-3px; margin-right:5px; object-fit:contain; opacity:.75; } /* símbolo da coleção onde a carta é comandante */
  @media (prefers-color-scheme: dark) { .sugestoes .tipo img.ic { filter:invert(.92); } }
  .sugestoes .tipo.orig { flex:1 1 100%; min-width:0; overflow-wrap:anywhere; } /* "→ nome original" numa segunda linha, inteiro */
  /* Sorteio em grupo: botão dividido (Sortear deck | grupo) com o mesmo gradiente; quadro de configuração; cartões por jogador. */
  .sorte-grupo { display:inline-flex; align-items:stretch; border-radius:999px; background:linear-gradient(100deg, #f3e6a6, #a9d3f5 28%, #cdbde6 50%, #f6ae9c 72%, #a8dcb2); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .sorte-grupo .sorte { background:transparent; box-shadow:none; }
  .sorte-grupo #btnSorte { border-radius:999px; }
  .sorte-grupo .mesa-btn { border:0; border-left:1px solid rgba(0,0,0,.22); border-radius:0 999px 999px 0; padding:4px 11px 4px 9px; }
  .mesa-cfg { max-height:calc(100vh - 32px); overflow:auto; }
  .mesa-tit { display:flex; align-items:center; gap:8px; margin:0 0 6px; }
  .mesa-tit h2 { margin:0; }
  .ajuda-btn { flex:none; width:24px; height:24px; padding:0; border-radius:50%; border:1.5px solid var(--line); background:transparent; color:var(--acc); font:inherit; font-size:14px; font-weight:700; line-height:1; cursor:pointer; }
  .ajuda-btn[aria-expanded="true"] { background:var(--f-acc); border-color:var(--f-acc); color:var(--f-accfg); }
  .ajuda { margin:2px 0 4px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; color:var(--mut); }
  .ajuda ul { margin:0; padding-left:18px; } .ajuda li { margin:5px 0; }

  .escolha-busca:focus { outline:none; border-color:var(--f-acc); box-shadow:0 0 0 3px var(--inAnel); }
  .escolha-lista { list-style:none; margin:0 0 12px; padding:0; overflow:auto; overscroll-behavior:contain; flex:1 1 auto; min-height:120px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .escolha-lista button { display:flex; align-items:center; gap:8px; width:100%; text-align:left; font:inherit; font-size:14px; color:var(--fg); background:transparent; border:0; border-radius:7px; padding:8px 8px; cursor:pointer; }
  .escolha-lista button:hover, .escolha-lista button:focus-visible { background:var(--line); outline:none; }

  .escolha-lista .nm { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
  .escolha-lista .nm .simbolos { margin-left:6px; vertical-align:-3px; }
  .escolha-lista .nm .simbolos img { width:14px; height:14px; }
  .escolha-lista .pc { flex:none; color:var(--mut); font-size:12.5px; font-weight:400; }
  .escolha-lista .vazio { padding:12px 8px; color:var(--mut); font-size:14px; }
  #escolhaSorte { display:inline-flex; align-items:center; gap:6px; margin-right:auto; }
  #escolhaSorte svg { width:16px; height:16px; }

  body.modo-mesa #grupos, body.modo-mesa #caixaBusca, body.modo-mesa #cxCor, body.modo-mesa #cxAno, body.modo-mesa #cxArq, body.modo-mesa .sorte-grupo, body.modo-mesa #contagem,
  body.modo-mesa #secCol, body.modo-mesa #colecoes, body.modo-mesa hr.div, body.modo-mesa #secDecks, body.modo-mesa #decks { display:none !important; }
  .mesa-cab { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:space-between; margin:2px 0 12px; }
  .mesa-cab .sec { margin:0; }
  .mesa-cab .sec .inteiro { white-space:nowrap; }
  .mesa-chk { margin-top:12px; }
  .mesa-chk .excl-l:has(input:disabled) { cursor:default; }
  .mesa-arq { display:flex; flex-wrap:wrap; gap:6px 14px; margin:-4px 0 12px; font-size:14px; color:var(--mut); }
  .mesa-arq b { display:inline-block; margin-left:4px; padding:2px 10px; border-radius:999px; background:var(--f-acc); color:var(--f-accfg); font-weight:600; }
  .mesa-acoes { display:flex; flex-wrap:wrap; gap:8px; }
  @media (max-width:520px) { /* celular: título + compartilhar na 1ª linha; "Sortear de novo" e "Alterar regras" lado a lado (mesma largura) na 2ª */
    .mesa-cab { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 6px; position:relative; }
    .mesa-acoes { display:contents; }
    .mesa-cab .sec { grid-column:1 / -1; min-height:38px; display:flex; align-items:center; padding-right:50px; }
    #btnCompMesa { position:absolute; top:0; right:0; }
    .mesa-acoes button:not(.icone) { justify-content:center; padding:7px 6px; } }
  .mesa-acoes button { display:inline-flex; align-items:center; gap:6px; }
  .mesa-acoes svg { width:16px; height:16px; flex:none; }
  .mesa-acoes .gira svg { animation:gira .6s cubic-bezier(.4,0,.2,1); }
  .mesa-bloco + .mesa-bloco { margin-top:14px; }
  .mesa-bloco > .sec { margin:0 0 6px; }
  .mesa-grade { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
  .jog { display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left; font:inherit; color:var(--fg); background:var(--card); border:1.5px solid var(--deckBorda); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .jog:hover { border-color:var(--fg); }
  .jog.on { border:2.5px solid transparent; padding:9px 11px; background:linear-gradient(var(--card), var(--card)) padding-box, var(--brilho, linear-gradient(var(--deckBorda), var(--deckBorda))) border-box; }
  @supports (background: color-mix(in srgb, red 10%, blue)) {
    .jog { background:var(--leve, var(--card)); } /* cartão do sorteio levemente tingido com as cores do deck */
    .jog.on { background:var(--tinta, linear-gradient(var(--card), var(--card))) padding-box, var(--brilho, linear-gradient(var(--deckBorda), var(--deckBorda))) border-box; }
  }
  .jog .quem { font-weight:700; font-size:15px; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; overflow-wrap:anywhere; }
  .jog .dnome { font-size:14px; font-weight:600; }

  .jog .dnome .simbolos img { width:14px; height:14px; }
  /* Tags de arquétipo nos cartões do sorteio: um matiz por arquétipo (--h; artefatos em cinza-aço, --s baixo), fundo claro e texto escuro no tema claro, o contrário no escuro */
  .arq-tag { --s:62%; display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:600; line-height:1.5; vertical-align:1px; white-space:nowrap;
    background:hsl(var(--h) var(--s) 92%); color:hsl(var(--h) var(--s) 27%); border:1px solid hsl(var(--h) var(--s) 80%); }
  @media (prefers-color-scheme: dark) { .arq-tag { background:hsl(var(--h) calc(var(--s) * .55) 20%); color:hsl(var(--h) var(--s) 80%); border-color:hsl(var(--h) calc(var(--s) * .55) 34%); } }
  .arq-sacrifice { --h:2; } .arq-tribal { --h:26; } .arq-tokens { --h:46; } .arq-lands { --h:82; } .arq-counters { --h:132; } .arq-blink { --h:186; }
  .arq-spellslinger { --h:214; } .arq-voltron { --h:244; } .arq-graveyard { --h:274; } .arq-enchantments { --h:304; } .arq-lifegain { --h:340; } .arq-artifacts { --h:210; --s:14%; }
  /* Filtro "Por arquétipo" escolhido: a cor do arquétipo (--h/--s vêm das classes .arq-<id>, as mesmas das etiquetas), um pouco mais forte que a etiqueta */
  /* Filtro "Por cor" escolhido: preenchimento nas cores da identidade (--selec) e borda de 1,5 px nas cores puras (--brilho), como o deck escolhido */
  .cor-caixa.on.cor-cores .cor-btn { background:var(--selec) padding-box, var(--brilho) border-box; color:var(--fg); border:1.5px solid transparent; font-weight:600; }
  .cor-caixa.on.cor-cores .cor-btn::after { color:var(--fg); }
  .cor-caixa.on[class*="arq-"] .cor-btn { background:hsl(var(--h) var(--s, 62%) 85%); color:hsl(var(--h) var(--s, 62%) 20%); border-color:hsl(var(--h) var(--s, 62%) 58%); }
  .cor-caixa.on[class*="arq-"] .cor-btn::after { color:hsl(var(--h) var(--s, 62%) 20%); }
  @media (prefers-color-scheme: dark) {
    .cor-caixa.on[class*="arq-"] .cor-btn { background:hsl(var(--h) calc(var(--s, 62%) * .6) 27%); color:hsl(var(--h) var(--s, 62%) 88%); border-color:hsl(var(--h) calc(var(--s, 62%) * .6) 46%); }
    .cor-caixa.on[class*="arq-"] .cor-btn::after { color:hsl(var(--h) var(--s, 62%) 88%); }
  }
  .mesa-arq b.arq-tag { font-size:inherit; padding:1px 9px; margin-left:4px; vertical-align:baseline; background:hsl(var(--h) var(--s) 92%); color:hsl(var(--h) var(--s) 27%); border:1px solid hsl(var(--h) var(--s) 80%); } /* "Arquétipo sorteado" com a cor do arquétipo */
  @media (prefers-color-scheme: dark) { .mesa-arq b.arq-tag { background:hsl(var(--h) calc(var(--s) * .55) 20%); color:hsl(var(--h) var(--s) 80%); border-color:hsl(var(--h) calc(var(--s) * .55) 34%); } }
  .jog .dinfo { font-size:12.5px; color:var(--mut); }
  /* Dica de que o cartão é um botão: linha "Ver lista ▾" separada no pé do cartão (vira "Ocultar lista ▴" quando aberto) e leve elevação ao passar o mouse. */
  .jog .verlista { align-self:stretch; display:flex; align-items:center; justify-content:space-between; margin-top:6px; padding-top:7px; border-top:1px solid var(--deckBorda); border-top-color:color-mix(in srgb, var(--fg) 32%, transparent); font-size:12.5px; font-weight:600; color:var(--acc); }
  .jog .verlista { margin-top:auto; } /* no computador os cartões lado a lado têm a mesma altura: "Ver lista" fica sempre embaixo */
  .jog > :nth-last-child(2) { margin-bottom:6px; }
  .jog .arq-linha { margin-top:auto; padding-top:6px; } /* etiquetas no pé do cartão, logo acima do "Ver lista" */
  .jog .arq-linha + .verlista { margin-top:0; }
  .jog .verlista::after { content:"▾"; font-size:11px; transition:transform .2s; }
  .jog.on .verlista::after { transform:rotate(180deg); }
  .jogw .jog { transition:transform .15s, box-shadow .15s, border-color .15s; }
  .jogw .jog:hover { transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.18); }
  .jogw .jog:active { transform:translateY(0); box-shadow:none; }
  @media (prefers-reduced-motion: reduce) { .jogw .jog { transition:none; } .jogw .jog:hover { transform:none; } }
  @keyframes revela { from { opacity:0; transform:translateY(12px) scale(.94); } }
  @media (prefers-reduced-motion: reduce) { .mesa-acoes .gira svg { animation:none; } }
  /* Trocar o deck de um jogador: o cartão vira um invólucro com o botão do jogador e um botão redondo (dado) no canto. */
  .jogw { position:relative; display:flex; }
  .jogw .jog { flex:1; min-width:0; }
  .jogw .quem { padding-right:42px; }
  .jogw.rev { animation:revela .5s cubic-bezier(.2,.8,.2,1) both; }
  .reroll { position:absolute; top:7px; right:7px; z-index:2; width:34px; height:34px; padding:0; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--acc); cursor:pointer; }
  .reroll:hover { color:var(--acc); border-color:var(--acc); }
  .reroll svg { width:23px; height:23px; }
  @media (prefers-reduced-motion: reduce) { .jogw.rev { animation:none; } }
  /* Excluir do sorteio (só no sorteio em grupo; guardado só na aba) */
  .excl { margin-top:16px; border:1px solid var(--line); border-radius:10px; padding:0 12px; }
  .excl > summary { display:flex; align-items:center; gap:10px; padding:10px 0; cursor:pointer; list-style:none; font-size:14px; font-weight:600; }
  .excl > summary::-webkit-details-marker { display:none; }
  .excl > summary::after { content:"▾"; font-size:11px; color:var(--mut); margin-left:auto; transition:transform .2s; }
  .excl[open] > summary::after { transform:rotate(180deg); }
  .excl .resumo { font-weight:400; font-size:12.5px; color:var(--mut); }
  .excl-corpo { padding:0 0 12px; }

  .excl-gh { display:flex; align-items:center; gap:4px; }
  .excl-l { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px; cursor:pointer; flex:1; min-width:0; }
  .excl-gh .excl-l { font-weight:600; }
  .excl-l input { width:18px; height:18px; flex:none; margin:0; accent-color:var(--f-acc); }

  .excl-tg { flex:none; width:30px; height:30px; border:0; border-radius:8px; background:transparent; color:var(--mut); font:inherit; font-size:11px; cursor:pointer; }
  .excl-tg:hover { background:var(--line); color:var(--fg); }

  .excl-cols { margin:0 0 6px 8px; padding-left:12px; border-left:2px solid var(--line); }
  .excl-cols[hidden] { display:none; }
  .excl-arq { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); column-gap:12px; }
  .excl-arq .excl-l { flex:none; }
  .excl-l input:disabled + .txt { color:var(--mut); }
  .excl-busca input { width:100%; font:inherit; font-size:16px; padding:8px 10px; border:1.5px solid var(--inBorda); border-radius:8px; background:var(--inBg); color:var(--fg); }
  .excl-busca input::placeholder { color:var(--mut); opacity:1; }
  .excl-busca input:focus { outline:none; border-color:var(--f-acc); box-shadow:0 0 0 3px var(--inAnel); }
  .excl-sug { list-style:none; margin:4px 0 0; padding:4px; border:1px solid var(--line); border-radius:10px; background:var(--card); max-height:220px; overflow:auto; }

  .chip:hover { border-color:var(--fg); }

</style>

<main>

<script>
// Dados embutidos (gerados por build_pauper.py): um "grupo" por número de cores (mono, duas, tres), cada um com os seus decks
// em ordem de participação no metagame. Cada deck: nome, lista (principal, linha em branco, "Sideboard" e o sideboard),
// ci (cores), pct e nmeta (participação e nº de decks no metagame), jogador, res (resultado), evento e data da lista.
