<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauper · Precons Commander</title>
<link rel="manifest" href="../manifest.json">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
  html { color-scheme:light dark; scrollbar-color:var(--line) var(--bg); }
  :root { --bg:#fafaf8; --fg:#1d1d1b; --mut:#6b6b66; --line:#d9d8d2; --acc:#2f5fd0; --accfg:#fff; --card:#fff; --levePct:9%; --ok:#1d7a3a; --warn:#b05a00;
    --g-acc:#1c3378; --g-accfg:#fff; --f-acc:#0b78b8; --f-accfg:#fff; /* tons de azul: grupos (escuro), coleções (--acc), filtros (claro) */
    --mW:#e4e0d2; --mU:#2b83d0; --mB:#6c588c; --mR:#d24d36; --mG:#2c8a48; --mC:#9b9a94; --deckBorda:#5f5e59;
    --inBg:#fff; --inBorda:#9a998f; --inSombra:0 1px 3px rgba(0,0,0,.10); --inAnel:rgba(11,120,184,.25); } /* campo de busca em destaque */ /* cores dos decks; borda neutra (escura no claro) */
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --mut:#9c9b94; --line:#34332f; --acc:#7da2ff; --accfg:#10131c; --card:#1e1e1c; --levePct:9%; --ok:#6fcf8a; --warn:#f0a04b;
      --g-acc:#3c5cc4; --g-accfg:#fff; --f-acc:#5ec4ef; --f-accfg:#0b1a22;
      --mW:#f6f4ee; --mU:#5aa8ee; --mB:#a991cc; --mR:#f07a62; --mG:#5cbf7c; --mC:#7f7e78; --deckBorda:#b4b3ac;
      --inBg:#2a2a27; --inBorda:#85847c; --inSombra:0 2px 8px rgba(0,0,0,.55); --inAnel:rgba(94,196,239,.32); }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .formato { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:0 0 10px; font-size:13px; background:var(--card); }
  .formato a { padding:3px 12px; color:var(--mut); text-decoration:none; font-weight:600; }
  .formato a[aria-current] { background:var(--g-acc); color:var(--g-accfg); }
  .formato a:not([aria-current]):hover { color:var(--fg); }
  .sub { color: var(--mut); margin: 0 0 16px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; }
  .tab:hover { border-color: var(--acc); }
  .tab.on { background:var(--acc); color:var(--accfg); border-color:var(--acc); }
  .tab.small { padding:4px 10px; font-size:14px; border-radius:8px; }
  .tab .n { opacity:.65; font-size:12px; margin-left:6px; white-space:nowrap; }
  .arq-linha { display:flex; flex-wrap:wrap; gap:4px 6px; }
  .arq-linha .arq-tag { margin-left:0; }
  #titulo .arq-tag { vertical-align:2px; }
  #titulo .tit-cmd, .painel-mesa .tit-cmd { display:block; font-size:13px; font-weight:400; color:var(--mut); margin-top:2px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .grow { flex:1; min-width:180px; }
  button.go { background:var(--acc); color:var(--accfg); border:0; padding:8px 16px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); padding:7px 12px; border-radius:8px; font:inherit; cursor:pointer; }
  .lista { position:relative; background:var(--bg); border-radius:8px; }
  textarea { display:block; position:relative; z-index:1; width:100%; min-height:420px; margin:0; background:transparent; -webkit-appearance:none; appearance:none; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font:13px/19px ui-monospace, Menlo, Consolas, monospace; resize:vertical; white-space:pre; overflow:auto; }
  .espelho { position:absolute; inset:0; overflow:hidden; border:1px solid transparent; border-radius:8px; padding:10px; font:13px/19px ui-monospace, Menlo, Consolas, monospace; white-space:pre; color:transparent; pointer-events:none; }
  .espelho div { height:19px; }
  .espelho div.hl { background:#ffe58a; border-radius:3px; }
  @media (prefers-color-scheme: dark) { .espelho div.hl { background:#5c4a00; } }
  input.filtro { width:100%; margin:0 0 12px; padding:10px 12px; background:var(--inBg); color:var(--fg); border:1.5px solid var(--inBorda); border-radius:10px; box-shadow:var(--inSombra); font:inherit; }
  input.filtro::placeholder { color:var(--mut); opacity:1; }
  input.filtro:focus { outline:none; border-color:var(--f-acc); box-shadow:0 0 0 3px var(--inAnel); }
  .status { color:var(--mut); margin-bottom:8px; }
  .sobre { color:var(--mut); font-size:14px; line-height:1.45; margin:0 0 12px; } /* estratégia do arquétipo e da variação */
  .status.ok { color:var(--ok); } .status.warn { color:var(--warn); }
  .sec { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--mut); font-weight:600; margin:16px 0 8px; }
  hr.div { border:0; border-top:2px solid var(--line); margin:18px 0 0; }
  .tab:not(.small) { font-weight:600; padding:8px 16px; }
  .tab.small { border-radius:6px; background:transparent; }
  /* Decks: borda neutra igual para todos (contrasta com o fundo); só o deck escolhido ganha as cores (borda, fundo e brilho). */
  .tab.small { --fd:var(--bg); border:1.5px solid var(--deckBorda); background:var(--fd); position:relative; transition:transform .15s; }
  .tab.small:hover { border-color:var(--fg); }
  .tab.small.on { --fd:var(--card); color:var(--fg); font-weight:600; border:2.5px solid transparent; background:linear-gradient(var(--card), var(--card)) padding-box, var(--brilho, linear-gradient(var(--deckBorda), var(--deckBorda))) border-box; transform:translateY(-2px); }
  @supports (background: color-mix(in srgb, red 10%, blue)) {
    .tab.small.on { background:var(--tinta, linear-gradient(var(--card), var(--card))) padding-box, var(--brilho, linear-gradient(var(--deckBorda), var(--deckBorda))) border-box; }
  }
  .tab.small.on::after { content:""; position:absolute; left:8%; right:8%; top:100%; height:9px; margin-top:1px; border-radius:50%; background:var(--brilho, var(--deckBorda)); filter:blur(5px); opacity:.9; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .tab.small { transition:none; } }
  .tab img.ic { width:18px; height:18px; vertical-align:-4px; margin-right:8px; object-fit:contain; }
  .tab.on img.ic { filter:invert(1); }
  @media (prefers-color-scheme: dark) { .tab img.ic { filter:invert(.92); } .tab.on img.ic { filter:none; } }
  #grupos { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
  #grupos .tab.on { background:var(--g-acc); color:var(--g-accfg); border-color:var(--g-acc); }
  #grupos .tab:hover { border-color:var(--g-acc); }
  #grupos .tab { border-radius:8px; text-align:center; padding:10px 8px; display:flex; align-items:center; justify-content:center; }
  @media (min-width:640px) { #grupos { grid-template-columns:repeat(4,1fr); } }
  @media (max-width:439px) { #grupos .tab { padding:10px 4px; font-size:14px; } #grupos .tab .n, #grupos .tab .mais { margin-left:4px; } }
  [hidden] { display:none !important; }
  .sec-col { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:30px; }
  .filtros { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 12px; }
  .cor-caixa { position:relative; display:inline-flex; }
  .cor-btn { position:relative; display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:13px; font-weight:500; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 28px 4px 12px; min-height:29px; cursor:pointer; }
  .cor-btn:hover { border-color:var(--f-acc); }
  .cor-btn::after { content:"▾"; position:absolute; right:11px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:12px; color:var(--mut); }
  .cor-caixa.on .cor-btn { background:var(--f-acc); color:var(--f-accfg); border-color:var(--f-acc); }
  .cor-caixa.on .cor-btn::after { color:var(--f-accfg); }
  /* Celular: grade fixa de 2 colunas, para as pílulas não mudarem de lugar quando o texto muda (símbolos, nome do arquétipo,
     × de tirar o filtro, "Limpar tudo" que aparece e some). O × fica por cima da seta, sem aumentar a pílula. */
  @media (max-width:520px) {
    .filtros { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 6px; }
    .filtros .cor-caixa { min-width:0; }
    .filtros .cor-caixa .cor-btn { flex:1; min-width:0; overflow:hidden; white-space:nowrap; padding-left:10px; padding-right:26px; }
    .filtros .limpar-cor { position:absolute; right:3px; top:50%; transform:translateY(-50%); margin:0; width:20px; height:20px; font-size:14px; z-index:1; }
    .filtros .cor-caixa.on .cor-btn::after { visibility:hidden; }
    .filtros .limpar-tudo { justify-self:center; grid-column:1 / -1; }
    .filtros .sorte-grupo { justify-self:start; }
    .filtros .sorte-grupo #btnSorte { white-space:nowrap; gap:4px; padding:4px 12px 4px 9px; }
    .filtros .sorte-grupo .mesa-btn { padding:4px 8px 4px 7px; }
    .filtros .cor-btn { gap:4px; }
    .filtros .cor-btn .simbolos { gap:2px; }
    .filtros .cor-btn .simbolos img { width:13px; height:13px; }
    .filtros .cor-caixa:nth-child(even) .cor-menu { left:auto; right:0; }
  }
  .limpar-cor { width:26px; height:26px; margin-left:4px; align-self:center; border:0; border-radius:999px; background:var(--line); color:var(--fg); font:inherit; font-size:17px; line-height:1; padding:0; cursor:pointer; }
  .limpar-cor:hover { background:var(--f-acc); color:var(--f-accfg); }
  .simbolos { display:inline-flex; gap:2px; flex:none; }
  .simbolos img { width:17px; height:17px; display:block; }
  .cor-btn .simbolos img { width:16px; height:16px; }
  .cor-menu { position:absolute; left:0; top:calc(100% + 4px); z-index:20; margin:0; padding:4px; list-style:none; min-width:220px; max-width:calc(100vw - 32px); background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-height:min(380px, 60vh); overflow:auto; overscroll-behavior:contain; outline:none; }
  .cor-menu li { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:7px 10px; border-radius:7px; cursor:pointer; font-size:14px; white-space:nowrap; }
  .cor-menu .num { color:var(--mut); font-size:12px; margin-left:7px; }
  .sorte { padding-right:12px; font-weight:600; color:#1d1d1b; border:0; background:linear-gradient(100deg, #f3e6a6, #a9d3f5 28%, #cdbde6 50%, #f6ae9c 72%, #a8dcb2); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  .sorte:hover { filter:brightness(1.05) saturate(1.15); }
  .sorte:active { transform:scale(.97); }
  .limpar-tudo { font:inherit; font-size:13px; color:var(--mut); background:transparent; border:1px dashed var(--line); border-radius:999px; padding:4px 12px; min-height:29px; cursor:pointer; }
  .limpar-tudo:hover { color:var(--fg); border-color:var(--fg); }
  .sorte::after { content:none; }
  .sorte svg { width:16px; height:16px; flex:none; }
  .sorte.gira svg { animation:gira .6s cubic-bezier(.4,0,.2,1); }
  @keyframes gira { to { transform:rotate(540deg) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .sorte.gira svg { animation:none; } }
  #decks { row-gap:10px; padding-bottom:4px; }
  .tab.small .simbolos { margin-left:8px; vertical-align:-3px; }
  .tab.small .simbolos img { width:14px; height:14px; }
  .cor-menu li.ativo { background:var(--line); }
  .cor-menu li[aria-selected="true"] { font-weight:600; color:var(--acc); }
  button.icone { padding:7px 10px; display:inline-flex; align-items:center; }
  button.icone svg { width:18px; height:18px; display:block; }
  .acoes { margin-bottom:8px; }
  #btnContra::after { content:" ▾"; font-size:11px; }
  .contra-box { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:4px 0 10px; background:var(--bg); }
  .contra-cab { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; }
  .contra-cab b .simbolos { margin-left:6px; vertical-align:-3px; }
  .contra-cab b .simbolos img { width:14px; height:14px; }
  .contra-x { padding:2px 9px; font-size:14px; line-height:1.3; }
  .contra-box .mut { color:var(--mut); font-size:13px; margin:6px 0 0; }
  .contra-conf { margin-top:10px; font-size:13px; padding:5px 10px; }
  .escolha-lista .fam-cab { display:flex; justify-content:space-between; gap:8px; padding:10px 8px 2px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .escolha-lista .fam-cab + li, .escolha-lista li.na-fam { padding-left:10px; }
  /* Deck otimizado: original e otimizada lado a lado (no celular, uma de cada vez, com seletor); verde = entra no deck principal, vermelho = sai */
  .dif { --entra:#1f8a4c; --sai:#c2412d; }
  @media (prefers-color-scheme: dark) { .dif { --entra:#5fd28f; --sai:#ff8a73; } }
  .dif-leg { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--mut); margin:2px 0 8px; }
  .dif-leg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .dif-leg .e i { background:var(--entra); } .dif-leg .s i { background:var(--sai); }
  .dif-seg { display:flex; margin-bottom:8px; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .dif-seg button { flex:1; font:inherit; font-size:14px; font-weight:600; padding:7px; background:transparent; color:var(--mut); border:0; cursor:pointer; }
  .dif-seg button[aria-pressed="true"] { background:var(--acc); color:var(--bg); }
  .dif-cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .dif-col { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 0; min-width:0; }
  .dif-col h4 { margin:0 10px 6px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .dif-col h4 b { color:var(--fg); }
  .dif-sec { margin:8px 10px 2px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }
  .dif-l { display:flex; align-items:center; gap:8px; padding:1px 10px; font:13px/19px ui-monospace, Menlo, Consolas, monospace; border-left:3px solid transparent; }
  .dif-l .nm { flex:1; min-width:0; overflow-wrap:anywhere; }
  .dif-l .bd { font:700 11.5px/17px system-ui, sans-serif; padding:0 6px; border-radius:9px; color:#fff; white-space:nowrap; }
  .dif-l.entra { border-left-color:var(--entra); background:color-mix(in srgb, var(--entra) 16%, transparent); }
  .dif-l.sai { border-left-color:var(--sai); background:color-mix(in srgb, var(--sai) 14%, transparent); }
  .dif-l.entra .bd { background:var(--entra); } .dif-l.sai .bd { background:var(--sai); }
  @media (prefers-color-scheme: dark) { .dif-l .bd { color:#111; } }
  .dif-col.orig .dif-l.sai.toda .nm { text-decoration:line-through; text-decoration-color:var(--sai); }
  .dif-col { cursor:pointer; transition:opacity .15s; }
  .dif-cols.ver-orig .dif-col.orig, .dif-cols.ver-otim .dif-col.otim { border:2px solid var(--acc); cursor:default; }
  .dif-cols.ver-orig .dif-col.otim, .dif-cols.ver-otim .dif-col.orig { opacity:.55; }
  .dif-cols.ver-orig .dif-col.otim:hover, .dif-cols.ver-otim .dif-col.orig:hover { opacity:.8; }
  .dif-copiar, #btnCopiar { margin-top:10px; }
  @media (max-width:640px) {
    .dif-cols { grid-template-columns:1fr; }
    .dif-cols.ver-otim .dif-col.orig, .dif-cols.ver-orig .dif-col.otim { display:none; }
  }
  .modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-caixa { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:14px; padding:20px; width:100%; max-width:430px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .modal-caixa h2 { font-size:18px; margin:0 0 6px; }
  .modal-caixa h2.ok { color:var(--ok); } .modal-caixa h2.erro { color:var(--warn); }
  .guia-sub { color:var(--mut); margin:0 0 10px; }
  .passos { margin:0 0 14px; padding-left:22px; } .passos li { margin:7px 0; }
  .guia-check { display:flex; gap:8px; align-items:center; color:var(--mut); font-size:14px; margin-bottom:16px; cursor:pointer; }
  .guia-botoes { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .aviso { position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60; width:max-content; max-width:calc(100% - 32px); background:var(--fg); color:var(--bg); padding:8px 14px; border-radius:18px; font-size:13px; box-shadow:0 6px 22px rgba(0,0,0,.25); text-align:center; }
  footer { margin-top:28px; color:var(--mut); font-size:12.5px; text-align:center; }
  .versao { margin:14px 0 2px; color:var(--mut); opacity:.75; font-size:11px; text-align:center; letter-spacing:.03em; } /* versão publicada (vem do sw.js na hora do build): serve para conferir se a página atualizou */
  footer a { color:inherit; }
  footer .como { max-width:540px; margin:16px auto 0; text-align:left; }
  footer .como p { margin:0 0 6px; text-align:center; }
  footer details { margin-top:4px; }
  footer summary { display:flex; width:max-content; margin:0 auto; align-items:center; gap:6px; list-style:none; cursor:pointer; color:var(--acc); font-weight:600; padding:4px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); }
  footer summary::-webkit-details-marker { display:none; }
  footer summary::after { content:"▾"; font-size:11px; transition:transform .2s; }
  footer details[open] summary::after { transform:rotate(180deg); }
  footer details[open] summary { margin-bottom:10px; }
  footer .como ol { margin:0; padding-left:22px; }
  footer .como li { margin:4px 0; }
  footer .como p.intro { margin:10px 0 6px; text-align:left; }
  footer .como p.nota { margin:8px 0 0; text-align:left; }
  footer .como b { color:var(--fg); }
  footer .ban ul { columns:2 200px; column-gap:20px; margin:0; padding:0; list-style:none; }
  footer .ban li { margin:0 0 4px; break-inside:avoid; }
  footer .ban li span { color:var(--mut); }
  footer .ban li.grupo-ban { column-span:all; break-inside:auto; margin-top:10px; }
  #decks .tab .n { margin-left:6px; }
  /* Duelo */
  .duelo-vs { text-align:center; font-weight:800; letter-spacing:.08em; color:var(--mut); margin:2px 0; font-size:13px; }
  .duelo-info { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .duelo-info h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin:0 0 8px; }
  .duelo-info h3 + * { margin-top:0; }
  .duelo-info section + section { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .duelo-info p { margin:4px 0; font-size:14px; }
  .duelo-info .mut { color:var(--mut); font-size:12.5px; }
  .otim-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 4px; }
  .otim-btn { font:inherit; font-weight:700; font-size:14px; padding:9px 10px; border-radius:10px; cursor:pointer; color:var(--fg); border:1.5px solid transparent; background:var(--tinta, var(--card)) padding-box, var(--brilho, var(--line)) border-box; }
  .otim-btn:hover { filter:brightness(1.04); }

  .excl-busca input { width:100%; font:inherit; font-size:16px; padding:8px 10px; border:1.5px solid var(--inBorda); border-radius:8px; background:var(--inBg); color:var(--fg); }

var FAMILIAS = [{"nome": "Madness", "slug": "madness", "n": 510, "mtgo": 340, "papel": 170, "pct": 15.3, "sobre": ["Aggro de descarte vermelho. Mágicas que compram cartas descartando (Grab the Prize, Highway Robbery, Faithless Looting) põem Fiery Temper e outras cartas com loucura em jogo por quase nada, enquanto criaturas que causam dano a cada mágica e queimas fecham o jogo em poucos turnos.", "Red discard aggro. Draw spells that discard (Grab the Prize, Highway Robbery, Faithless Looting) put Fiery Temper and other madness cards into play for almost nothing, while creatures that deal damage on every spell and burn end the game in a few turns."]}, {"nome": "Affinity", "slug": "affinity", "n": 305, "mtgo": 165, "papel": 140, "pct": 9.1, "sobre": ["Artefatos baratos e terrenos-artefato deixam de graça ou quase de graça as cartas com afinidade (Myr Enforcer, Thoughtcast, Refurbished Familiar, Utrom Monitor). O deck despeja a mão cedo, compra muito sacrificando artefatos e usa a metalurgia (Galvanic Blast, Dispatch) como remoção.", "Cheap artifacts and artifact lands make the affinity cards (Myr Enforcer, Thoughtcast, Refurbished Familiar, Utrom Monitor) free or nearly free. The deck empties its hand early, draws a lot by sacrificing artifacts and uses metalcraft (Galvanic Blast, Dispatch) as removal."]}, {"nome": "Terror", "slug": "terror", "n": 275, "mtgo": 178, "papel": 97, "pct": 8.2, "sobre": ["Tempo azul com muitas mágicas baratas de comprar e filtrar (Brainstorm, Ponder, Thought Scour). Elas enchem o cemitério e barateiam Tolarian Terror e Cryptic Serpent, ameaças grandes por um ou dois manás, protegidas por Counterspell.", "Blue tempo with lots of cheap draw and filter spells (Brainstorm, Ponder, Thought Scour). They fill the graveyard and make Tolarian Terror and Cryptic Serpent big threats for one or two mana, backed by Counterspell."]}, {"nome": "Faeries", "slug": "faeries", "n": 252, "mtgo": 210, "papel": 42, "pct": 7.5, "sobre": ["Controle com fadas de flash: Spellstutter Sprite anula mágicas no turno do adversário, Baleful Strix e Snuff Out seguram as criaturas e o monarca (Thorn of the Black Rose) e os ninjas dão vantagem de cartas.", "Flash-faerie control: Spellstutter Sprite counters spells on the opponent's turn, Baleful Strix and Snuff Out hold off creatures, and the monarch (Thorn of the Black Rose) and ninjas provide card advantage."]}, {"nome": "Tron", "slug": "tron", "n": 197, "mtgo": 72, "papel": 125, "pct": 5.9, "sobre": ["Rampa com os três terrenos de Urza (Mine, Power Plant, Tower), que juntos dão 7 manás no 3º turno. Expedition Map, Ancient Stirrings e Crop Rotation acham as peças; depois o deck ganha vida, controla a mesa com artefatos e baixa ameaças caras.", "Ramp with the three Urza lands (Mine, Power Plant, Tower), which together make 7 mana on turn 3. Expedition Map, Ancient Stirrings and Crop Rotation find the pieces; then the deck gains life, controls the board with artifacts and lands expensive threats."]}, {"nome": "Control", "slug": "control", "n": 190, "mtgo": 142, "papel": 48, "pct": 5.7, "sobre": ["Controle azul e preto de jogo longo: contramágicas, remoção barata (Snuff Out, Cast Down, Cut Down), compra (Lórien Revealed) e Baleful Strix. Vence com o monarca, Murmuring Mystic e vantagem de cartas acumulada.", "Long-game blue-black control: counterspells, cheap removal (Snuff Out, Cast Down, Cut Down), card draw (Lórien Revealed) and Baleful Strix. Wins with the monarch, Murmuring Mystic and accumulated card advantage."]}, {"nome": "Elves", "slug": "elves", "n": 186, "mtgo": 98, "papel": 88, "pct": 5.6, "sobre": ["Mono verde de elfos que geram mana (Llanowar Elves, Priest of Titania). Lead the Stampede e Winding Way recarregam a mão, Quirion Ranger desvira as criaturas e Timberwatch Elf ou Nyxborn Hydra transformam a mana e o número de elfos em dano.", "Mono-green elves that make mana (Llanowar Elves, Priest of Titania). Lead the Stampede and Winding Way refill the hand, Quirion Ranger untaps creatures, and Timberwatch Elf or Nyxborn Hydra turn the mana and elf count into damage."]}, {"nome": "Rally", "slug": "rally", "n": 163, "mtgo": 99, "papel": 64, "pct": 4.9, "sobre": ["Aggro vermelho explosivo: criaturas de 1 mana, Burning-Tree Emissary para jogar duas mágicas no mesmo turno e Rally at the Hornburg e Goblin Bushwhacker para atacar com tudo de uma vez, com ímpeto. Lightning Bolt e Galvanic Blast terminam o serviço. (As poucas listas de Burn do MTGGoldfish entram na variação Mono Red Rally.)", "Explosive red aggro: 1-mana creatures, Burning-Tree Emissary to cast two spells in one turn, and Rally at the Hornburg and Goblin Bushwhacker to swing with everything at once, with haste. Lightning Bolt and Galvanic Blast finish the job. (The few MTGGoldfish Burn lists are part of the Mono Red Rally variation.)"]}, {"nome": "Spy Combo", "slug": "spy_combo", "n": 160, "mtgo": 88, "papel": 72, "pct": 4.8, "sobre": ["Combo com quase nenhum terreno no deck: Balustrade Spy, mirando o próprio jogador, joga o grimório inteiro no cemitério; então Dread Return (pela recapitulação, sacrificando três criaturas) traz Lotleth Giant, que causa 1 de dano por criatura no cemitério. Criaturas de mana e defensores montam a jogada.", "Combo with almost no lands: Balustrade Spy, targeting yourself, puts the whole library into the graveyard; then Dread Return (by flashback, sacrificing three creatures) brings back Lotleth Giant, which deals 1 damage per creature card in the graveyard. Mana creatures and defenders set it up."]}, {"nome": "Bogles", "slug": "bogles", "n": 149, "mtgo": 101, "papel": 48, "pct": 4.5, "sobre": ["Criaturas com resistência a magia (Slippery Bogle, Gladecover Scout, Silhana Ledgewalker) recebem auras (Ethereal Armor, Ancestral Mask, Rancor, Armadillo Cloak) e viram uma ameaça enorme que a remoção pontual não alcança.", "Hexproof creatures (Slippery Bogle, Gladecover Scout, Silhana Ledgewalker) get auras (Ethereal Armor, Ancestral Mask, Rancor, Armadillo Cloak) and become a huge threat that targeted removal can't touch."]}, {"nome": "Ruby Storm", "slug": "ruby_storm", "n": 131, "mtgo": 105, "papel": 26, "pct": 3.9, "sobre": ["Combo de muitas mágicas num turno: redutores de custo (Thornscape Familiar, Goblin Anarchomancer), rituais (Seething Song, Desperate Ritual) e terrenos que dão mana dobrada abastecem cartas que exilam do topo para jogar (Glimpse the Impossible, Wrenn's Resolve), até fechar com Seize the Storm.", "Many-spells-in-one-turn combo: cost reducers (Thornscape Familiar, Goblin Anarchomancer), rituals (Seething Song, Desperate Ritual) and lands that make double mana fuel cards that exile from the top to play (Glimpse the Impossible, Wrenn's Resolve), until Seize the Storm closes it out."]}, {"nome": "Synthesizer", "slug": "synthesizer", "n": 99, "mtgo": 55, "papel": 44, "pct": 3.0, "sobre": ["Boros de artefatos: Glint Hawk e Kor Skyfisher voltam para a mão artefatos que compram ou trocam cartas ao entrar (Melded Moxite, Experimental Synthesizer, Lembas) e reaproveitam o efeito, enquanto a metalurgia liga Galvanic Blast e Dispatch.", "Boros artifacts: Glint Hawk and Kor Skyfisher return artifacts that draw or loot on entering (Melded Moxite, Experimental Synthesizer, Lembas) to reuse them, while metalcraft turns on Galvanic Blast and Dispatch."]}, {"nome": "Gardens", "slug": "gardens", "n": 95, "mtgo": 71, "papel": 24, "pct": 2.8, "sobre": ["Controle preto e verde de atrito: Khalni Garden e artefatos que compram cartas servem de combustível para sacrifícios que compram (Fanatical Offering, Eviscerator's Insight), muita remoção e Crypt Rats ou Pestilence limpam a mesa, e Troll of Khazad-dûm fecha o jogo.", "Black-green attrition control: Khalni Garden and artifacts that draw cards fuel sacrifice-to-draw spells (Fanatical Offering, Eviscerator's Insight), lots of removal plus Crypt Rats or Pestilence clear the board, and Troll of Khazad-dûm finishes the game."]}, {"nome": "Ephemerate", "slug": "ephemerate", "n": 88, "mtgo": 37, "papel": 51, "pct": 2.6, "sobre": ["Controle azul de valor com criaturas que fazem algo ao entrar (Mulldrifter, Archaeomancer, Baleful Strix, Augur of Bolas), reaproveitadas com Ephemerate. Contramágicas e remoção seguram o jogo até a vantagem de cartas decidir.", "Blue value control with creatures that do something on entering (Mulldrifter, Archaeomancer, Baleful Strix, Augur of Bolas), reused with Ephemerate. Counterspells and removal hold the game until card advantage decides it."]}, {"nome": "White Aggro", "slug": "white_aggro", "n": 80, "mtgo": 39, "papel": 41, "pct": 2.4, "sobre": ["Aggro branco de muitas criaturas pequenas: Battle Screech e fichas enchem a mesa, Kor Skyfisher e Thraben Inspector dão valor, Prismatic Strands evita combates ruins e reforços em massa terminam o jogo.", "White go-wide aggro: Battle Screech and tokens fill the board, Kor Skyfisher and Thraben Inspector add value, Prismatic Strands blanks bad combats and team pumps end the game."]}, {"nome": "Wildfire", "slug": "wildfire", "n": 70, "mtgo": 43, "papel": 27, "pct": 2.1, "sobre": ["Jund de artefatos e sacrifício: Refurbished Familiar e terrenos-artefato, sacrifícios que compram (Fanatical Offering, Eviscerator's Insight), Krark-Clan Shaman para limpar a mesa e Cleansing Wildfire, que compra carta e pode tirar um terreno-chave do adversário (como os de Tron).", "Jund artifacts and sacrifice: Refurbished Familiar and artifact lands, sacrifice-to-draw spells (Fanatical Offering, Eviscerator's Insight), Krark-Clan Shaman to sweep the board, and Cleansing Wildfire, which draws a card and can take out a key opposing land (such as Tron lands)."]}, {"nome": "Ponza", "slug": "ponza", "n": 57, "mtgo": 22, "papel": 35, "pct": 1.7, "sobre": ["Rampa verde e vermelha com destruição de terrenos: Arbor Elf, Utopia Sprawl e Wild Growth aceleram a mana, Mwonvuli Acid-Moss e Thermokarst atrasam o adversário, e cascata (Boarding Party, Annoyed Altisaur) e iniciativa (Avenging Hunter) trazem ameaças grandes.", "Green-red ramp with land destruction: Arbor Elf, Utopia Sprawl and Wild Growth speed up mana, Mwonvuli Acid-Moss and Thermokarst set the opponent back, and cascade (Boarding Party, Annoyed Altisaur) and initiative (Avenging Hunter) bring big threats."]}, {"nome": "Turbo Fog", "slug": "turbo_fog", "n": 53, "mtgo": 37, "papel": 16, "pct": 1.6, "sobre": ["Deck que quase não tem criaturas: anula o dano de combate turno após turno com Moment's Peace, Tangle e outros \"fogs\", compra muitas cartas e ganha vida, e vence pelo cansaço do adversário.", "A deck with almost no creatures: it prevents combat damage turn after turn with Moment's Peace, Tangle and other fogs, draws lots of cards and gains life, and wins by outlasting the opponent."]}, {"nome": "Familiars", "slug": "familiars", "n": 52, "mtgo": 34, "papel": 18, "pct": 1.6, "sobre": ["Combo azul e branco de loops: Sunscape Familiar barateia as mágicas azuis, Snap devolve criaturas e desvira terrenos, e Archaeomancer e Ephemerate reaproveitam as mágicas, gerando mana, cartas e vida (God-Pharaoh's Faithful) a cada volta.", "Blue-white loop combo: Sunscape Familiar makes blue spells cheaper, Snap bounces creatures and untaps lands, and Archaeomancer and Ephemerate reuse the spells, producing mana, cards and life (God-Pharaoh's Faithful) on each loop."]}, {"nome": "Mono-Blue Faeries", "slug": "mono_blue_faeries", "n": 51, "mtgo": 8, "papel": 43, "pct": 1.5, "sobre": ["Tempo mono azul com criaturas voadoras de 1 mana, ninjutsu (Ninja of the Deep Hours, Moon-Circuit Hacker) para comprar cartas ao causar dano, Spellstutter Sprite e Counterspell para proteger a vantagem.", "Mono-blue tempo with 1-mana flyers, ninjutsu (Ninja of the Deep Hours, Moon-Circuit Hacker) to draw cards on damage, and Spellstutter Sprite and Counterspell to protect the lead."]}, {"nome": "Gates", "slug": "gates", "n": 43, "mtgo": 21, "papel": 22, "pct": 1.3, "sobre": ["Midrange com muitos Portais (Gates): eles dão mana de quase todas as cores e Basilisk Gate deixa uma criatura enorme por turno. Criaturas com vínculo com a vida (Sacred Cat, Outlaw Medic) e Prismatic Strands seguram os decks agressivos.", "Midrange with lots of Gates: they make almost every color and Basilisk Gate turns one creature huge each turn. Lifelink creatures (Sacred Cat, Outlaw Medic) and Prismatic Strands hold off aggressive decks."]}, {"nome": "Sacrifice", "slug": "sacrifice", "n": 34, "mtgo": 10, "papel": 24, "pct": 1.0, "sobre": ["Aggro preto de sacrifício: criaturas de 1 mana que deixam algo ao morrer (fichas, Tesouros) alimentam Carrion Feeder, Bloodthrone Vampire e Mortician Beetle, e Supernatural Stamina e Unearth trazem criaturas de volta.", "Black sacrifice aggro: 1-mana creatures that leave something behind when they die (tokens, Treasures) feed Carrion Feeder, Bloodthrone Vampire and Mortician Beetle, and Supernatural Stamina and Unearth bring creatures back."]}, {"nome": "Cycle Storm", "slug": "cycle_storm", "n": 22, "mtgo": 8, "papel": 14, "pct": 0.7, "sobre": ["Combo de reciclagem: rituais (Dark Ritual, Cabal Ritual, Songs of the Damned) pagam muitos ciclos num turno, e cada ciclo causa dano com Drannith Stinger; Reaping the Graves (com tempestade) devolve as criaturas para repetir.", "Cycling combo: rituals (Dark Ritual, Cabal Ritual, Songs of the Damned) pay for many cyclings in one turn, and each cycle deals damage with Drannith Stinger; Reaping the Graves (with storm) returns the creatures to do it again."]}, {"nome": "Inside Out Combo", "slug": "inside_out_combo", "n": 16, "mtgo": 3, "papel": 13, "pct": 0.5, "sobre": ["Combo Boros: Tireless Tribe ganha resistência descartando cartas e Inside Out troca poder e resistência, criando um atacante enorme; Escape Tunnel o deixa imbloqueável e Fling é outra saída. Os Eidolons voltam para a mão a cada mágica multicolorida.", "Boros combo: Tireless Tribe gains toughness by discarding cards and Inside Out swaps power and toughness, creating a huge attacker; Escape Tunnel makes it unblockable and Fling is another out. The Eidolons return to hand on every multicolored spell."]}, {"nome": "Dredge", "slug": "dredge", "n": 15, "mtgo": 6, "papel": 9, "pct": 0.4, "sobre": ["Deck de cemitério: Satyr Wayfinder, Town Greeter, Circle of the Land Druid e Stinkweed Imp (dragar) enchem o cemitério, e Dread Return traz Lotleth Giant, que causa dano pelo número de criaturas lá.", "Graveyard deck: Satyr Wayfinder, Town Greeter, Circle of the Land Druid and Stinkweed Imp (dredge) fill the graveyard, and Dread Return brings back Lotleth Giant, which deals damage for each creature card there."]}, {"nome": "Glintblade", "slug": "glintblade", "n": 15, "mtgo": 2, "papel": 13, "pct": 0.4, "sobre": ["Midrange branco e preto de artefatos: Glint Hawk e Kor Skyfisher reaproveitam Tithing Blade (o adversário sacrifica uma criatura) e artefatos que compram cartas, com remoção e Refurbished Familiar para o atrito.", "White-black artifact midrange: Glint Hawk and Kor Skyfisher reuse Tithing Blade (the opponent sacrifices a creature) and artifacts that draw cards, with removal and Refurbished Familiar for attrition."]}, {"nome": "Walls Combo", "slug": "walls_combo", "n": 10, "mtgo": 5, "papel": 5, "pct": 0.3, "sobre": ["Combo mono verde de defensores: Axebane Guardian e Overgrown Battlement geram mana pelo número de defensores; com Freed from the Real em Axebane Guardian a mana fica infinita, e Valakut Invoker a transforma em dano.", "Mono-green defender combo: Axebane Guardian and Overgrown Battlement make mana for each defender; with Freed from the Real on Axebane Guardian the mana becomes infinite, and Valakut Invoker turns it into damage."]}, {"nome": "Infect", "slug": "infect", "n": 9, "mtgo": 2, "papel": 7, "pct": 0.3, "sobre": ["Aggro de veneno: criaturas com infectar (Glistener Elf, Blight Mamba, Ichorclaw Myr) recebem reforços baratos (Mutagenic Growth, Might of Old Krosa, Rancor) e proteção (Snakeskin Veil, Vines of Vastwood) para dar 10 marcadores de veneno em dois ou três ataques.", "Poison aggro: infect creatures (Glistener Elf, Blight Mamba, Ichorclaw Myr) get cheap pumps (Mutagenic Growth, Might of Old Krosa, Rancor) and protection (Snakeskin Veil, Vines of Vastwood) to deal 10 poison counters in two or three attacks."]}, {"nome": "Poison Storm", "slug": "poison_storm", "n": 9, "mtgo": 5, "papel": 4, "pct": 0.3, "sobre": ["Combo de veneno sem criaturas: Infectious Inquiry e Prologue to Phyresis dão marcadores de veneno e as mágicas de proliferar (Contentious Plan, Experimental Augury, Vivisurgeon's Insight) aumentam todos de uma vez, enquanto Weather the Storm ganha vida.", "Creatureless poison combo: Infectious Inquiry and Prologue to Phyresis give poison counters and proliferate spells (Contentious Plan, Experimental Augury, Vivisurgeon's Insight) grow them all at once, while Weather the Storm gains life."]}, {"nome": "Devotion", "slug": "devotion", "n": 5, "mtgo": 0, "papel": 5, "pct": 0.1, "sobre": ["Mono preto de devoção: permanentes com muitos símbolos de mana preta no custo aumentam o dreno de Gray Merchant of Asphodel, e Exhume traz criaturas do cemitério para repetir o efeito. Hoje são poucas listas, todas em Outras.", "Mono-black devotion: permanents with many black mana symbols in their cost grow Gray Merchant of Asphodel's drain, and Exhume brings creatures back from the graveyard to repeat it. Few lists right now, all in Others."]}]; // [{nome, slug, n, mtgo, papel, pct}], em ordem de nº de listas
